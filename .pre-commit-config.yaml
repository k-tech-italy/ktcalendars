repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
        args: [ "--verbose" ]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.31.2"
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.6"
    hooks:
      - id: ruff-format
      - id: ruff
        args: [ "--fix", "--unsafe-fixes", "--exit-non-zero-on-fix" ]
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ '--baseline', '.secrets.baseline' ]
        exclude: (.*/tenant\.sql|.*\.js|.gitlab-ci.yml|uv.lock)


  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: v1.0.6
    hooks:
      - id: python-bandit-vulnerability-check
        args: [ --skip, "B101", --recursive, clumper ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.9
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # Check the whole project, not only staged files: .mypy.ini skips
        # unlisted ktcalendars modules (follow_imports=skip), which would
        # otherwise turn imports into Any on partial commits.
        args: [ --strict, --ignore-missing-imports, --exclude, ^tests/testproject/, src, tests ]
        pass_filenames: false
        additional_dependencies:
          - pytest
          - freezegun
          - python-dateutil
          - holidays
