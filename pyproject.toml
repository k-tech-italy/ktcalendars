[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "ktcalendars"
description = "Country-specific holiday-aware calendars and dates"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "NOTICE.md", "LICENSE.md" ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "holidays",
  "typing-extensions>=4.15",
]
optional-dependencies.psycopg = [
  "psycopg>=2.9.1",
]

[dependency-groups]
dev = [
  "diff-cover>=10.6",
  "freezegun>=1.5.2",
  "pre-commit>=4.6.2",
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "pytest-randomly>=5",
  "pytest-xdist>=3.8",
  "tox>=4.65",
  "tox-uv>=1.36.1",
  "types-setuptools",
]
checks = [
  "detect-secrets>=1.5",
  "mypy>=2.4.1",
  "ruff>=0.17.6",
]
demo = [
  "django>=5.2.17",
  "pytest-django>=4.14",
]
documentation = [
  "mkdocs>=1.5.3",
  "mkdocs-awesome-pages-plugin>=2.9.3",
  "mkdocs-click>=0.8.1",
  "mkdocs-ezglossary-plugin>=2.1",
  "mkdocs-ezlinks-plugin>=0.1.14",
  "mkdocs-gen-files>=0.6.1",
  "mkdocs-get-deps>=0.2.2",
  "mkdocs-include-markdown-plugin>=7.3.2",
  "mkdocs-link-marker>=0.3",
  "mkdocs-macros-plugin>=1.5",
  "mkdocs-material[imaging]>=9.7.7",
  "mkdocs-minify-plugin",
  "mkdocs-redirects",
  "mkdocs-simple-hooks>=0.1.5",
  "mkdocstrings[python]>=1.0.6",
  "pymdown-extensions>=12.3",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/ktcalendars/version.py"
build.targets.wheel.packages = [ "src/ktcalendars" ]
build.targets.sdist.include = [
  "src/ktcalendars/**/*.*",
]
build.targets.sdist.exclude = [
  "src/ktcalendars/**/~*.*",
]
build.targets.sdist.ignore-vcs = true

[tool.hatch.version.raw-options]
# Ensures the local version matches standard PEP 440 formatting
local_scheme = "no-local-version"

[tool.uv]
default-groups = [ "dev", "checks" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.pytest]
ini_options.addopts = [
  "--import-mode=importlib",
]
