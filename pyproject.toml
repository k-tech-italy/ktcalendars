[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "ktcalendars"
description = "Country-specific holiday-aware calendars and dates"
readme = "README.md"
license = "Apache-2.0"
license-files = [ "NOTICE.md", "LICENSE.md" ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "holidays",
  "pytest-xdist>=3.8",
  "typing-extensions>=4.15",
]

optional-dependencies.django = [
  "django>=5.2.17",
  "pytest-django>=4.14",
]

optional-dependencies.psycopg = [
  "psycopg>=2.9.1",
]

[dependency-groups]
dev = [
  "diff-cover>=10.5",
  "freezegun>=1.5.2",
  "pre-commit>=4.2",
  "pytest>=8.3.3",
  "pytest-cov>=5",
  "pytest-randomly>=3.16",
  "tox>=4.25",
  "tox-uv>=1.28.1",
  "types-setuptools",
]

checks = [
  "detect-secrets>=1.5",
  "mypy>=1.17.1",
  "ruff>=0.12.12",
]
documentation = [
  "mkdocs>=1.5.3",
  "mkdocs-awesome-pages-plugin>=2.9.3",
  "mkdocs-click>=0.8.1",
  "mkdocs-ezglossary-plugin>=1.6.10",
  "mkdocs-ezlinks-plugin>=0.1.14",
  "mkdocs-gen-files>=0.5",
  "mkdocs-get-deps>=0.2",
  "mkdocs-include-markdown-plugin>=6.2.2",
  "mkdocs-link-marker>=0.1.3",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material[imaging]>=9.5.15",
  "mkdocs-minify-plugin",
  "mkdocs-redirects",
  "mkdocs-simple-hooks>=0.1.5",
  "mkdocstrings[python]>=0.24.1",
  "pymdown-extensions>=10.7.1",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/ktcalendars/version.py"
build.targets.sdist.ignore-vcs = true
build.targets.sdist.include = [
  "src/ktcalendars/**/*.*",
]
build.targets.sdist.exclude = [
  "src/ktcalendars/**/~*.*",
]
build.targets.wheel.packages = [ "src/ktcalendars" ]
version.source = "vcs"

[tool.hatch.version.raw-options]
# Ensures the local version matches standard PEP 440 formatting
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]

[tool.uv]
default-groups = [ "dev", "checks" ]
