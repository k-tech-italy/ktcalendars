[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
# The version only lives in git tags (hatch-vcs derives the package version
# from them at build time), so read the current version from the SCM and
# don't rewrite any version file on bump.
version_provider = "scm"
update_changelog_on_bump = true
# Tell cz to only update its own file when bumping versions
version_files = [
    "cz.toml:version"
]